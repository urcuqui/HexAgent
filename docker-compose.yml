services:
  app:
    build:
      context: .
      target: runtime
    image: hexagent:lab
    entrypoint: ["hexagent-web"]
    command: ["--host", "0.0.0.0", "--port", "5000"]
    env_file:
      - .env
    environment:
      HEXAGENT_MOCK_MODE: "${HEXAGENT_MOCK_MODE:-true}"
      HEXAGENT_ENABLE_NMAP: "${HEXAGENT_ENABLE_NMAP:-false}"
      HEXAGENT_REPORT_DIR: /app/reports
    restart: unless-stopped
    volumes:
      - ./reports:/app/reports
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
