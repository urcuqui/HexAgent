[project]
name = "hexagent"
version = "0.1.0"
description = "Agentic web application penetration testing assistant (educational POC) built with LangGraph + LangChain."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "HexAgent" }]
license = { text = "MIT" }
keywords = ["langgraph", "langchain", "pentest", "agent", "security", "education"]

dependencies = [
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
web = [
    "flask>=3.0",
    "markdown>=3.6",
    "nh3>=0.2",
]
browser = [
    "playwright>=1.44",
]

[project.scripts]
hexagent = "app.cli:main"
hexagent-web = "app.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# link-mode = "copy" was an earlier attempt to avoid the BSD UF_HIDDEN flag
# that uv sets on .venv and its contents on macOS. Python 3.12 site.py skips
# hidden .pth files, so the editable-install path entry is never loaded.
# Copying from cache still produces a hidden file because the destination
# directory (.venv/lib/…/site-packages) itself carries UF_HIDDEN.
# The wrappers run via `python -m app.cli` / `python -m app.web` from the
# project root, which bypasses editable-install .pth import issues entirely.
# See scripts/hexagent*.sh and README troubleshooting section.
link-mode = "copy"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
